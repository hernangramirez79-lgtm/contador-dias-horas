<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta Regresiva</title>
<meta name="description" content="Mirá cuánto falta: días, horas, minutos y segundos.">
<meta property="og:title" content="⏳ Cuenta regresiva">
<meta property="og:description" content="Tocá para ver cuánto falta, en vivo.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna centrada; el contador es el héroe, el editor queda debajo, plegable. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #141a2b;
  --muted: #5d6680;
  --line: #d5dbe7;
  --accent: #2f5bea;
  --tile: #141a2b;
  --tile-ink: #f4f6fb;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121c; --surface: #171d2b; --ink: #eef1f8; --muted: #9aa3bb;
    --line: #2a3246; --accent: #7d9bff; --tile: #222a3d; --tile-ink: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121c; --surface: #171d2b; --ink: #eef1f8; --muted: #9aa3bb;
  --line: #2a3246; --accent: #7d9bff; --tile: #222a3d; --tile-ink: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 56px;
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 9vw, 60px); line-height: 1; margin: 6px 0 0; text-wrap: balance; text-transform: uppercase; }
.target { color: var(--muted); margin-top: 10px; }
.clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.clock .num { font-size: clamp(40px, 12vw, 84px); }
.clock .lbl { font-size: clamp(9px, 2.6vw, 12px); letter-spacing: .1em; }
.unit { background: var(--tile); color: var(--tile-ink); border-radius: 14px; padding: 18px 8px 14px; text-align: center; position: relative; overflow: hidden; }
.unit::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--bg); opacity: .35; }
.num { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 16vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; }
.lbl { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-top: 8px; }
.done { font-family: var(--display); font-weight: 800; font-size: 40px; text-align: center; color: var(--accent); text-transform: uppercase; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
button { font: 600 15px var(--body); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.toast { color: var(--accent); font-weight: 600; font-size: 14px; min-height: 1.2em; }
.editor { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.editor h2 { margin: 0; font-size: 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row { grid-template-columns: 1fr; } }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
input { font: 16px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; width: 100%; }
.hint { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }
textarea.fallback { width: 100%; font: 14px var(--body); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
a.btn { display: inline-flex; align-items: center; font: 600 15px var(--body); border-radius: 10px; padding: 12px 18px; text-decoration: none; background: #1fa855; color: #fff; }
a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Faltan</div>
    <h1 id="title">Año Nuevo 2027</h1>
    <div class="target" id="target"></div>
  </header>

  <section class="clock" id="clock" aria-live="polite">
    <div class="unit"><div class="num" id="d">00</div><div class="lbl">Días</div></div>
    <div class="unit"><div class="num" id="h">00</div><div class="lbl">Horas</div></div>
    <div class="unit"><div class="num" id="m">00</div><div class="lbl">Minutos</div></div>
    <div class="unit"><div class="num" id="s">00</div><div class="lbl">Segundos</div></div>
  </section>
  <div class="done" id="done" hidden>¡Llegó el día!</div>

  <div>
    <div class="actions">
      <a class="btn" id="waShare" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
      <button id="copyLink" type="button">Copiar link</button>
      <button id="copyMsg" type="button">Copiar mensaje</button>
    </div>
    <p class="toast" id="toast"></p>
    <textarea class="fallback" id="fallback" rows="3" hidden readonly></textarea>
  </div>

  <form class="editor" id="form">
    <h2>Configurar evento</h2>
    <label>Nombre del evento
      <input id="inName" type="text" maxlength="60" value="Año Nuevo 2027">
    </label>
    <div class="row">
      <label>Fecha <input id="inDate" type="date" value="2027-01-01" required></label>
      <label>Hora <input id="inTime" type="time" value="00:00" required></label>
    </div>
    <div class="actions"><button class="primary" type="submit" id="save">Actualizar cuenta regresiva</button></div>
    <p class="hint">Al actualizar, el link de la página guarda el evento. Usá "Enviar por WhatsApp" o "Copiar link" y quien lo abra ve la misma cuenta regresiva, en vivo.</p>
  </form>
</main>

<script>
(function () {
  var state = { name: "Año Nuevo 2027", date: new Date(2027, 0, 1, 0, 0) };
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, "0"); };

  function toHex(s) { return Array.from(new TextEncoder().encode(s)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join(""); }
  function fromHex(h) { var b = new Uint8Array((h.match(/.{2}/g) || []).map(function (x) { return parseInt(x, 16); })); return new TextDecoder().decode(b); }

  function readHash() {
    var m = /^#c-(\d{12})(?:-([0-9a-f]+))?$/.exec(location.hash);
    if (!m) return;
    var s = m[1];
    var d = new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(8, 10), +s.slice(10, 12));
    if (isNaN(d)) return;
    state.date = d;
    if (m[2]) { try { state.name = fromHex(m[2]) || state.name; } catch (e) {} }
  }
  function writeHash() {
    var d = state.date;
    var s = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes());
    var h = "#c-" + s + (state.name ? "-" + toHex(state.name) : "");
    try { history.replaceState(null, "", h); } catch (e) { location.hash = h; }
  }

  function remaining() {
    var ms = Math.max(0, state.date - new Date());
    var secs = Math.ceil(ms / 1000);
    return { ms: ms, d: Math.floor(secs / 86400), h: Math.floor((secs % 86400) / 3600), m: Math.floor((secs % 3600) / 60), s: secs % 60 };
  }

  var fmt = new Intl.DateTimeFormat("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });

  function render() {
    var r = remaining();
    $("title").textContent = state.name || "Mi evento";
    $("target").textContent = fmt.format(state.date) + " h";
    $("d").textContent = r.d > 99 ? r.d : pad(r.d);
    $("h").textContent = pad(r.h);
    $("m").textContent = pad(r.m);
    $("s").textContent = pad(r.s);
    var over = r.ms === 0;
    $("clock").hidden = over;
    $("done").hidden = !over;
  }

  function syncForm() {
    var d = state.date;
    $("inName").value = state.name;
    $("inDate").value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    $("inTime").value = pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function toast(t) { $("toast").textContent = t; clearTimeout(toast.t); toast.t = setTimeout(function () { $("toast").textContent = ""; }, 3000); }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var p = $("inDate").value.split("-"), t = $("inTime").value.split(":");
    var d = new Date(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]);
    if (isNaN(d)) { toast("Revisá la fecha y la hora."); return; }
    state.name = $("inName").value.trim();
    state.date = d;
    writeHash(); render();
    toast("Cuenta regresiva actualizada.");
  });

  function message() {
    var r = remaining();
    return r.ms === 0
      ? "⏰ ¡Llegó " + state.name + "!"
      : "⏳ Faltan " + r.d + " días, " + r.h + " horas, " + r.m + " minutos y " + r.s + " segundos para " + state.name + " (" + fmt.format(state.date) + " h)";
  }
  function copy(text, okMsg) {
    var fb = $("fallback");
    function fallback() { fb.value = text; fb.hidden = false; fb.focus(); fb.select(); toast("Seleccioná el texto y copialo."); }
    try {
      navigator.clipboard.writeText(text).then(function () { fb.hidden = true; toast(okMsg); }, fallback);
    } catch (e) { fallback(); }
  }
  function ensureHash() { if (!location.hash) writeHash(); }

  $("copyMsg").addEventListener("click", function () { copy(message(), "Mensaje copiado. Pegalo en WhatsApp."); });
  $("copyLink").addEventListener("click", function () { ensureHash(); copy(location.href, "Link copiado."); });
  $("waShare").addEventListener("click", function () {
    ensureHash();
    this.href = "https://wa.me/?text=" + encodeURIComponent(message() + "\n\nMirala en vivo 👉 " + location.href);
  });

  window.addEventListener("hashchange", function () { readHash(); syncForm(); render(); });
  readHash(); syncForm(); render();
  setInterval(render, 1000);
})();
</script>

</body>
</html>
